<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QA Quiz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-grid"></div>

  <div class="app">
    <header class="header">
      <div class="logo">
        <span class="logo-bracket">[</span>
        <span class="logo-text">QA</span>
        <span class="logo-dot">.</span>
        <span class="logo-quiz">quiz</span>
        <span class="logo-bracket">]</span>
        <span class="logo-topic-sep" id="logoTopic" style="display:none"></span>
      </div>
      <div class="header-meta" id="headerMeta" style="display:none">
        <span class="meta-item" id="metaCounter">1 / 100</span>
        <span class="meta-sep">//</span>
        <span class="meta-item correct-meta"><span id="metaCorrect">0</span> ✓</span>
        <span class="meta-sep">//</span>
        <span class="meta-item wrong-meta"><span id="metaWrong">0</span> ✗</span>
        <button class="finish-btn" id="finishBtn">Фініш</button>
      </div>
    </header>

    <!-- START / TOPIC PICKER SCREEN -->
    <div class="screen" id="startScreen" style="display:flex">
      <div class="start-content" style="display:none"></div>
      <div class="start-deco" style="display:none"></div>
      <div class="topic-picker" id="topicPicker"></div>
    </div>

    <!-- QUIZ SCREEN -->
    <div class="screen" id="quizScreen" style="display:none">
      <div class="progress-bar-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="question-area">
        <div class="question-num" id="questionNum">01</div>
        <span class="question-topic-tag" id="questionTopicTag" style="display:none"></span>
        <div class="question-text" id="questionText"></div>
      </div>
      <div class="options" id="optionsContainer"></div>
      <div class="feedback" id="feedbackBox" style="display:none"></div>
      <div class="quiz-actions">
        <button class="next-btn" id="nextBtn" style="display:none">Наступне <span>→</span></button>
      </div>
    </div>

    <!-- RESULTS SCREEN -->
    <div class="screen" id="resultsScreen" style="display:none">
      <div class="results-content">
        <div id="medalContainer" style="display:none" class="medal-container"></div>
        <div class="result-label">Результат</div>
        <div class="result-percent" id="resultPercent">0%</div>
        <div class="result-msg" id="resultMsg"></div>
        <div class="result-stats">
          <div class="stat-card correct-card"><div class="stat-n" id="resCorrect">0</div><div class="stat-l">правильних</div></div>
          <div class="stat-card wrong-card"><div class="stat-n" id="resWrong">0</div><div class="stat-l">неправильних</div></div>
          <div class="stat-card total-card"><div class="stat-n" id="resTotal">0</div><div class="stat-l">пройдено</div></div>
          <div class="stat-card skip-card"><div class="stat-n" id="resSkipped">0</div><div class="stat-l">залишилось</div></div>
        </div>
        <button class="start-btn" id="restartBtn"><span>Обрати тему</span><span class="btn-arrow">↩</span></button>
        <div class="wrong-review" id="wrongReview" style="display:none">
          <div class="wrong-review-title">Помилкові питання</div>
          <div id="wrongList"></div>
        </div>
      </div>
    </div>
  </div>

  <script src="quiz.js"></script>
</body>
</html>
