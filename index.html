<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d14">
  <meta name="description" content="Free QA interview trainer: 1044 questions across 14 topics — Selenium, Playwright, Cypress, Appium, REST APIs, SQL, Python, Java. English & Ukrainian, no signup, works offline.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="QA Quiz">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>QA Quiz — interview prep for QA engineers</title>

  <!-- Open Graph / social sharing -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="QA Quiz">
  <meta property="og:title" content="QA Quiz — 1044 interview questions across 14 topics">
  <meta property="og:description" content="Free QA interview trainer with explanations and a spaced-repetition mistake bank. No signup, works offline. English & Ukrainian.">
  <meta property="og:url" content="https://yarikmuzyka.github.io/quiz/">
  <meta property="og:image" content="https://yarikmuzyka.github.io/quiz/og-image.png">
  <meta property="og:image:width" content="2400">
  <meta property="og:image:height" content="1260">
  <meta property="og:locale" content="en_US">
  <meta property="og:locale:alternate" content="uk_UA">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="QA Quiz — 1044 interview questions across 14 topics">
  <meta name="twitter:description" content="Free QA interview trainer with explanations and a spaced-repetition mistake bank. No signup, works offline.">
  <meta name="twitter:image" content="https://yarikmuzyka.github.io/quiz/og-image.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <!-- GoatCounter analytics — replace YOURCODE with your own site code from goatcounter.com -->
  <script data-goatcounter="https://qa-quiz-yarik.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <div class="bg-grid"></div>

  <div class="app">
    <header class="header">
      <div class="logo">
        <span class="term-dot"></span><span class="term-dot"></span><span class="term-dot"></span>
        <span class="logo-user">qa@quiz</span><span class="logo-colon">:~$</span>
        <span class="logo-cmd" id="logoTopic">study --menu</span><span class="logo-cursor"></span>
      </div>
      <button class="lang-btn" id="langBtn" title="Switch language">--lang <span class="lang-val" id="langVal">uk</span></button>
      <button class="feedback-btn" id="feedbackOpenBtn">--feedback</button>

      <div class="header-meta" id="headerMeta" style="display:none">
        <span class="meta-item" id="metaCounter">1 / 100</span>
        <span class="meta-sep">//</span>
        <span class="meta-item correct-meta"><span id="metaCorrect">0</span> ✓</span>
        <span class="meta-sep">//</span>
        <span class="meta-item wrong-meta"><span id="metaWrong">0</span> ✗</span>
        <button class="finish-btn" id="finishBtn">Фініш</button>
      </div>
    </header>

    <!-- START / TOPIC PICKER SCREEN -->
    <div class="screen" id="startScreen" style="display:flex">
      <div class="start-content" style="display:none"></div>
      <div class="start-deco" style="display:none"></div>
      <div class="topic-picker" id="topicPicker"></div>
    </div>

    <!-- QUIZ SCREEN -->
    <div class="screen" id="quizScreen" style="display:none">
      <div class="progress-bar-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      </div>
      <div class="question-area">
        <div class="spec-file">
          <span class="spec-filename" id="specFileName"></span><span class="spec-lineno" id="questionNum"></span>
          <span class="spec-suite">› describe(<span id="specDescribe"></span>)</span>
        </div>
        <div class="question-text">
          <span class="syn-kw">it(</span><span class="syn-str" id="questionText"></span><span class="syn-kw">) {</span>
        </div>
      </div>
      <div class="options" id="optionsContainer"></div>
      <div class="feedback" id="feedbackBox" style="display:none"></div>
      <div class="spec-close">}</div>
      <div class="quiz-actions">
        <button class="next-btn" id="nextBtn" style="display:none">Наступне <span>→</span></button>
      </div>
    </div>

    <!-- RESULTS SCREEN -->
    <div class="screen" id="resultsScreen" style="display:none">
      <div class="results-content">
        <div id="resultBadge" class="ci-result-badge"></div>
        <div class="result-label">$ build report</div>
        <div class="result-percent" id="resultPercent">0%</div>
        <div class="result-msg" id="resultMsg"></div>
        <div class="run-summary">
          <div class="run-row"><span class="k">passed</span><span class="v pass" id="resCorrect">0</span></div>
          <div class="run-row"><span class="k">failed</span><span class="v fail" id="resWrong">0</span></div>
          <div class="run-row"><span class="k">total</span><span class="v" id="resTotal">0</span></div>
          <div class="run-row"><span class="k">pending</span><span class="v" id="resSkipped">0</span></div>
        </div>
        <div class="result-actions">
          <button class="start-btn result-action-btn" id="shareBadgeBtn"><span>$ share --badge</span><span class="btn-arrow">⇩</span></button>
          <button class="start-btn result-action-btn" id="restartBtn"><span>Обрати тему</span><span class="btn-arrow">↩</span></button>
        </div>
        <div class="wrong-review" id="wrongReview" style="display:none">
          <div class="wrong-review-title">✗ FAILURES</div>
          <div id="wrongList"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- MOCK TOPIC PICKER MODAL -->
  <div class="modal-overlay" id="mockTopicsModal" style="display:none">
    <div class="modal mock-modal">
      <div class="modal-header">
        <div class="modal-title" id="mockTopicsTitle">Mock Interview — теми</div>
        <button class="modal-close" id="mockTopicsClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-label" id="mockTopicsLabel">Обери теми для mock interview</div>
        <div class="mock-topic-actions">
          <button type="button" class="mock-topic-action" id="mockTopicsAll">select all</button>
          <button type="button" class="mock-topic-action" id="mockTopicsClear">clear</button>
        </div>
        <div class="mock-topic-list" id="mockTopicList"></div>
        <div class="mock-topic-summary" id="mockTopicSummary"></div>
      </div>
      <div class="modal-footer">
        <button class="modal-submit" id="mockTopicsNextBtn">Далі →</button>
      </div>
    </div>
  </div>

  <!-- COUNT PICKER MODAL -->
  <div class="modal-overlay" id="countModal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="countModalTitle">Обери кількість питань</div>
        <button class="modal-close" id="countModalClose">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-label">Скільки питань пройти?</div>
        <div class="count-options">
          <button class="count-opt" data-n="10">
            <span class="count-opt-n">10</span>
            <span class="count-opt-l">швидкий раунд</span>
          </button>
          <button class="count-opt" data-n="50">
            <span class="count-opt-n">50</span>
            <span class="count-opt-l">стандартний</span>
          </button>
          <button class="count-opt" data-n="100">
            <span class="count-opt-n">100</span>
            <span class="count-opt-l">поглиблений</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- FEEDBACK MODAL -->
  <div class="modal-overlay" id="feedbackModal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">Залишити відгук</div>
        <button class="modal-close" id="feedbackCloseBtn">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-label">Як тобі квіз?</div>
        <div class="stars" id="starsContainer">
          <span class="star" data-v="1">★</span>
          <span class="star" data-v="2">★</span>
          <span class="star" data-v="3">★</span>
          <span class="star" data-v="4">★</span>
          <span class="star" data-v="5">★</span>
        </div>
        <div class="modal-label">Коментар <span class="modal-label-opt">(необовʼязково)</span></div>
        <textarea class="modal-textarea" id="feedbackText" placeholder="Що сподобалось, що варто покращити..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="modal-submit" id="feedbackSubmitBtn">Надіслати →</button>
      </div>
    </div>
  </div>

  <script src="quiz.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js');
      });
    }
  </script>
</body>
</html>
